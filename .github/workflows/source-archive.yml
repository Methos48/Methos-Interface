name: Methos Source Archive
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        run: |
          git archive --format=zip --prefix=Methos/ HEAD -o Methos-Source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Methos-Source-Code
          path: Methos-Source.zip
          if-no-files-found: error
          retention-days: 90
