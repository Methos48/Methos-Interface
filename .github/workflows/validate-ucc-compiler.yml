name: Validar compilador UCC de Interlude

on:
  push:
    paths:
      - "Compilador  U.zip"
      - ".github/workflows/validate-ucc-compiler.yml"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ucc:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio sin credenciales persistentes
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Extraer el kit UCC de Interlude
        shell: pwsh
        run: |
          $archive = Join-Path $PWD "Compilador  U.zip"
          if (!(Test-Path -LiteralPath $archive)) { throw "No se encontró Compilador  U.zip." }
          $root = Join-Path $PWD "ucc-validation"
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $kit = Join-Path $root "Compilador  U"
          if (!(Test-Path (Join-Path $kit "Interlude\System\ucc.exe"))) { throw "El ZIP no contiene UCC.exe." }
          "KIT=$kit" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compilar todas las clases .uc con UCC
        shell: pwsh
        run: |
          $script = Join-Path $env:KIT "Compilar.ps1"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script
          if ($LASTEXITCODE -ne 0) { throw "UCC no pudo compilar las fuentes .uc." }
          $output = Join-Path $env:KIT "Testar\system\Interface.u"
          if (!(Test-Path -LiteralPath $output)) { throw "UCC no generó Testar\system\Interface.u." }
          $file = Get-Item -LiteralPath $output
          if ($file.Length -lt 65536) { throw "El Interface.u generado es demasiado pequeño para considerarse válido." }
          Write-Host "UCC compiló Interface.u: $($file.Length) bytes."

      - name: Validar estructura del paquete compilado
        shell: pwsh
        run: |
          $validator = Join-Path $env:KIT "ValidatePackage.ps1"
          $output = Join-Path $env:KIT "Testar\system\Interface.u"
          & $validator -PackagePath $output

      - name: Descompilar el Interface.u real para probar el recorrido completo
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:KIT "Interlude\Interface\Classes"
          $referenceDir = Join-Path $env:KIT "ReferenceClasses"
          if (Test-Path -LiteralPath $sourceDir) {
            Copy-Item -LiteralPath $sourceDir -Destination $referenceDir -Recurse -Force
            Get-ChildItem -LiteralPath $sourceDir -File -Filter "*.uc" | Remove-Item -Force
          }
          dotnet run --project tests/MethosUEngine.Tests/MethosUEngine.Tests.csproj -c Release -- --export-sources Interface.u $sourceDir
          if ($LASTEXITCODE -ne 0) { throw "No se pudieron extraer todas las clases de Interface.u." }
          $count = (Get-ChildItem -LiteralPath $sourceDir -File -Filter "*.uc").Count
          if ($count -lt 150) { throw "Se exportaron muy pocas clases ($count)." }
          Write-Host "Fuentes extraídas del Interface.u real: $count clases."
          $generated = Join-Path $sourceDir "ClanDrawerWnd.uc"
          $reference = Join-Path $referenceDir "ClanDrawerWnd.uc"
          foreach ($candidate in @($generated, $reference)) {
            if (Test-Path -LiteralPath $candidate) {
              Write-Host "===== $candidate : líneas 105-120 ====="
              $lines = Get-Content -LiteralPath $candidate
              for ($n = 104; $n -lt [Math]::Min(120, $lines.Count); $n++) {
                Write-Host ("{0}: {1}" -f ($n + 1), $lines[$n])
              }
              Write-Host "===== Declaraciones state ====="
              Select-String -LiteralPath $candidate -Pattern "^\s*(auto\s+|simulated\s+)?state\b" | ForEach-Object { Write-Host "$($_.LineNumber): $($_.Line)" }
            }
          }

      - name: Guardar fuentes generadas por el descompilador para diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: methos-u-decompiled-interface-sources
          path: |
            ucc-validation/Compilador  U/Interlude/Interface/Classes/*.uc
            ucc-validation/Compilador  U/ReferenceClasses/ClanDrawerWnd.uc
          if-no-files-found: warn

      - name: Recompilar las fuentes extraídas del Interface.u real con UCC
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:KIT "Compilar.ps1")
          if ($LASTEXITCODE -ne 0) { throw "UCC no pudo recompilar las fuentes extraídas de Interface.u." }
          $output = Join-Path $env:KIT "Testar\system\Interface.u"
          if (!(Test-Path -LiteralPath $output)) { throw "No se generó el Interface.u recompilado." }
          & (Join-Path $env:KIT "ValidatePackage.ps1") -PackagePath $output

      - name: Comparar con Interface.u original y registrar hashes
        shell: pwsh
        run: |
          $compiled = Join-Path $env:KIT "Testar\system\Interface.u"
          $original = Join-Path $PWD "Interface.u"
          Get-FileHash -Algorithm SHA256 $compiled | Format-List
          if (Test-Path -LiteralPath $original) {
            $a = (Get-FileHash -Algorithm SHA256 $compiled).Hash
            $b = (Get-FileHash -Algorithm SHA256 $original).Hash
            Write-Host "UCC_OUTPUT_SHA256=$a"
            Write-Host "REPO_INTERFACE_SHA256=$b"
            Write-Host "IDENTICAL=$($a -eq $b)"
          }

      - name: Publicar paquetes y fuentes de referencia (sin ejecutables)
        uses: actions/upload-artifact@v4
        with:
          name: interlude-ucc-reference
          path: |
            ucc-validation/Compilador  U/Interlude/System/*.u
            ucc-validation/Compilador  U/Interlude/Interface/Classes/*.uc
            ucc-validation/Compilador  U/Testar/system/Interface.u
          if-no-files-found: error
