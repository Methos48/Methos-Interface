name: Validar compilador UCC de Interlude

on:
  push:
    paths:
      - "Compilador  U.zip"
      - ".github/workflows/validate-ucc-compiler.yml"
      - "tests/**"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ucc:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio sin credenciales persistentes
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Extraer el kit UCC de Interlude
        shell: pwsh
        run: |
          $archive = Join-Path $PWD "Compilador  U.zip"
          if (!(Test-Path -LiteralPath $archive)) { throw "No se encontró Compilador  U.zip." }
          $root = Join-Path $PWD "ucc-validation"
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $kit = Join-Path $root "Compilador  U"
          if (!(Test-Path (Join-Path $kit "Interlude\System\ucc.exe"))) { throw "El ZIP no contiene UCC.exe." }
          "KIT=$kit" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Comparar Interface.u incluido en el kit con el Interface.u del repositorio
        shell: pwsh
        run: |
          $embedded = Join-Path $env:KIT "Testar\system\Interface.u"
          $repositoryPackage = Join-Path $PWD "Interface.u"
          if ((Test-Path -LiteralPath $embedded) -and (Test-Path -LiteralPath $repositoryPackage)) {
            $embeddedHash = (Get-FileHash -LiteralPath $embedded -Algorithm SHA256).Hash
            $repositoryHash = (Get-FileHash -LiteralPath $repositoryPackage -Algorithm SHA256).Hash
            Write-Host "KIT_INTERFACE_SIZE=$((Get-Item $embedded).Length)"
            Write-Host "REPOSITORY_INTERFACE_SIZE=$((Get-Item $repositoryPackage).Length)"
            Write-Host "KIT_INTERFACE_SHA256=$embeddedHash"
            Write-Host "REPOSITORY_INTERFACE_SHA256=$repositoryHash"
            if ($embeddedHash -eq $repositoryHash) {
              Write-Host "EXACT_INTERFACE_MATCH=TRUE"
            } else {
              Write-Host "EXACT_INTERFACE_MATCH=FALSE"
            }
          } else {
            Write-Host "No hay un Interface.u compilado en el kit o en la raíz del repositorio."
          }

      - name: Compilar todas las clases .uc con UCC
        shell: pwsh
        run: |
          $script = Join-Path $env:KIT "Compilar.ps1"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script
          if ($LASTEXITCODE -ne 0) { throw "UCC no pudo compilar las fuentes .uc." }
          $output = Join-Path $env:KIT "Testar\system\Interface.u"
          if (!(Test-Path -LiteralPath $output)) { throw "UCC no generó Testar\system\Interface.u." }
          $file = Get-Item -LiteralPath $output
          if ($file.Length -lt 65536) { throw "El Interface.u generado es demasiado pequeño para considerarse válido." }
          Write-Host "UCC compiló Interface.u: $($file.Length) bytes."

      - name: Validar estructura del paquete compilado
        shell: pwsh
        run: |
          $validator = Join-Path $env:KIT "ValidatePackage.ps1"
          $output = Join-Path $env:KIT "Testar\system\Interface.u"
          & $validator -PackagePath $output

      - name: Comprobar si UCC recompila el Interface.u original de forma idéntica
        shell: pwsh
        run: |
          $generated = Join-Path $env:KIT "Testar\system\Interface.u"
          $original = Join-Path $PWD "Interface.u"
          $generatedHash = (Get-FileHash -LiteralPath $generated -Algorithm SHA256).Hash
          $originalHash = (Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash
          Write-Host "UCC_REBUILD_SHA256=$generatedHash"
          Write-Host "ORIGINAL_INTERFACE_SHA256=$originalHash"
          Write-Host "UCC_REBUILD_EXACT_MATCH=$($generatedHash -eq $originalHash)"

      - name: Ejecutar pruebas unitarias del motor y normalizadores
        shell: pwsh
        run: |
          dotnet run --project tests/MethosUEngine.Tests/MethosUEngine.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Fallaron las pruebas unitarias del motor o los normalizadores." }

      - name: Probar el backend UCC integrado en Methos U Engine
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:KIT "Interlude\Interface\Classes"
          $editedSourceDir = Join-Path $env:RUNNER_TEMP "Methos-U-Edited-Source-Test"
          Copy-Item -LiteralPath $sourceDir -Destination $editedSourceDir -Recurse -Force
          $editedClass = Join-Path $editedSourceDir "GMInventoryWnd.uc"
          $source = [System.IO.File]::ReadAllText($editedClass)
          $pattern = '(?s)(function\s+int\s+IsLOrREar\s*\(\s*int\s+a_ServerID\s*\)\s*\{\s*return\s+)0(\s*;)'
          $match = [regex]::Match($source, $pattern)
          if (!$match.Success) { throw "No se encontró el cuerpo original de GMInventoryWnd.IsLOrREar para la prueba de modificación real." }
          $edited = [regex]::Replace($source, $pattern, '${1}1${2}', 1)
          if ($edited -eq $source) { throw "La modificación de GMInventoryWnd.IsLOrREar no produjo cambios." }
          [System.IO.File]::WriteAllText($editedClass, $edited, [System.Text.UTF8Encoding]::new($false))
          Write-Host "EDITED_SOURCE=GMInventoryWnd.IsLOrREar return 0 -> return 1"
          $output = Join-Path $env:KIT "Testar\system\Interface-csharp.u"
          dotnet run --project tests/MethosUEngine.Tests/MethosUEngine.Tests.csproj -c Release -- --ucc-compile $env:KIT $editedSourceDir $output
          if ($LASTEXITCODE -ne 0) { throw "El backend UCC integrado en Methos U no pudo compilar." }
          & (Join-Path $env:KIT "ValidatePackage.ps1") -PackagePath $output
          dotnet run --project tests/MethosUEngine.Tests/MethosUEngine.Tests.csproj -c Release -- --verify-function-return $output GMInventoryWnd IsLOrREar 1
          if ($LASTEXITCODE -ne 0) { throw "El bytecode final no refleja la modificación de GMInventoryWnd.IsLOrREar." }
          $generatedHash = (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash
          $originalHash = (Get-FileHash -LiteralPath (Join-Path $PWD "Interface.u") -Algorithm SHA256).Hash
          Write-Host "METHOS_UCC_SHA256=$generatedHash"
          Write-Host "ORIGINAL_INTERFACE_SHA256=$originalHash"
          Write-Host "METHOS_UCC_EXACT_MATCH=$($generatedHash -eq $originalHash)"

      - name: "Diagnóstico no bloqueante: exportar fuentes con UELib"
        id: uelib_export
        continue-on-error: true
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:KIT "Interlude\Interface\Classes"
          $referenceDir = Join-Path $env:KIT "ReferenceClasses"
          if (Test-Path -LiteralPath $sourceDir) {
            New-Item -ItemType Directory -Path $referenceDir -Force | Out-Null
            Copy-Item -Path (Join-Path $sourceDir "*") -Destination $referenceDir -Recurse -Force
            Get-ChildItem -LiteralPath $sourceDir -File -Filter "*.uc" | Remove-Item -Force
          }
          dotnet run --project tests/MethosUEngine.Tests/MethosUEngine.Tests.csproj -c Release -- --export-sources Interface.u $sourceDir
          if ($LASTEXITCODE -ne 0) { throw "No se pudieron extraer todas las clases de Interface.u." }
          $count = (Get-ChildItem -LiteralPath $sourceDir -File -Filter "*.uc").Count
          if ($count -lt 150) { throw "Se exportaron muy pocas clases ($count)." }
          Write-Host "Fuentes extraídas del Interface.u real: $count clases."
          $referenceFiles = Get-ChildItem -LiteralPath $referenceDir -File -Filter "*.uc"
          $different = @()
          foreach ($referenceFile in $referenceFiles) {
            $generatedFile = Join-Path $sourceDir $referenceFile.Name
            if (!(Test-Path -LiteralPath $generatedFile)) { $different += "$($referenceFile.Name): MISSING"; continue }
            $referenceHash = (Get-FileHash -LiteralPath $referenceFile.FullName -Algorithm SHA256).Hash
            $generatedHash = (Get-FileHash -LiteralPath $generatedFile -Algorithm SHA256).Hash
            if ($referenceHash -ne $generatedHash) { $different += "$($referenceFile.Name): CHANGED" }
          }
          Write-Host "SOURCE_FILES_DIFFERENT_FROM_REFERENCE=$($different.Count)"
          $different | Select-Object -First 30 | ForEach-Object { Write-Host $_ }
          $uiCommon = Join-Path $sourceDir "UICommonAPI.uc"
          if (Test-Path -LiteralPath $uiCommon) {
            $uiLines = Get-Content -LiteralPath $uiCommon
            Write-Host "===== UICommonAPI.uc : líneas 15850-15868 ====="
            for ($n = 15849; $n -lt [Math]::Min(15868, $uiLines.Count); $n++) {
              Write-Host ("{0}: {1}" -f ($n + 1), $uiLines[$n])
            }
          }
          $generated = Join-Path $sourceDir "ClanDrawerWnd.uc"
          $reference = Join-Path $referenceDir "ClanDrawerWnd.uc"
          foreach ($candidate in @($generated, $reference)) {
            if (Test-Path -LiteralPath $candidate) {
              Write-Host "===== $candidate : líneas 105-120 ====="
              $lines = Get-Content -LiteralPath $candidate
              for ($n = 104; $n -lt [Math]::Min(120, $lines.Count); $n++) {
                Write-Host ("{0}: {1}" -f ($n + 1), $lines[$n])
              }
              Write-Host "===== Declaraciones state ====="
              Select-String -LiteralPath $candidate -Pattern "^\s*(auto\s+|simulated\s+)?state\b" | ForEach-Object { Write-Host "$($_.LineNumber): $($_.Line)" }
            }
          }
          $generatedParty = Join-Path $sourceDir "PartyMatchOutWaitListWnd.uc"
          $referenceParty = Join-Path $referenceDir "PartyMatchOutWaitListWnd.uc"
          foreach ($candidate in @($generatedParty, $referenceParty)) {
            if (Test-Path -LiteralPath $candidate) {
              Write-Host "===== $candidate : líneas 220-240 ====="
              $lines = Get-Content -LiteralPath $candidate
              for ($n = 219; $n -lt [Math]::Min(240, $lines.Count); $n++) {
                Write-Host ("{0}: {1}" -f ($n + 1), $lines[$n])
              }
            }
          }

      - name: Guardar fuentes generadas por el descompilador para diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: methos-u-decompiled-interface-sources
          path: |
            ucc-validation/Compilador  U/Interlude/Interface/Classes/*.uc
            ucc-validation/Compilador  U/ReferenceClasses/*.uc
          if-no-files-found: warn

      - name: "Diagnóstico no bloqueante: recompilar salida del descompilador UELib"
        id: uelib_roundtrip
        continue-on-error: true
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:KIT "Interlude\Interface\Classes"
          $referenceDir = Join-Path $env:KIT "ReferenceClasses"
          dotnet run --project tests/MethosUEngine.Tests/MethosUEngine.Tests.csproj -c Release -- --normalize-sources $env:KIT $sourceDir $referenceDir
          if ($LASTEXITCODE -ne 0) { throw "No se pudieron normalizar las llamadas nativas de UnrealScript." }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:KIT "Compilar.ps1")
          if ($LASTEXITCODE -ne 0) { throw "UCC no pudo recompilar las fuentes extraídas de Interface.u." }
          $output = Join-Path $env:KIT "Testar\system\Interface.u"
          if (!(Test-Path -LiteralPath $output)) { throw "No se generó el Interface.u recompilado." }
          & (Join-Path $env:KIT "ValidatePackage.ps1") -PackagePath $output

      - name: Publicar paquetes y fuentes de referencia (sin ejecutables)
        uses: actions/upload-artifact@v4
        with:
          name: interlude-ucc-reference
          path: |
            ucc-validation/Compilador  U/Interlude/System/*.u
            ucc-validation/Compilador  U/Interlude/Interface/Classes/*.uc
            ucc-validation/Compilador  U/Testar/system/Interface.u
          if-no-files-found: error
