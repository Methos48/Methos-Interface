name: Methos U Editor - Analisis y compilacion Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analizar:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Probar lectura y descompilacion con UELib
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Ejecutar prueba de compatibilidad del paquete
        shell: pwsh
        run: |
          dotnet run --project tools/PackageProbe/PackageProbe.csproj --configuration Release -- "Interface.u" "probe-export" 2>&1 | Tee-Object -FilePath probe-log.txt
        continue-on-error: true

      - name: Guardar resultado de UELib
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methos-u-uelib-probe
          path: |
            probe-export/
            probe-log.txt
          if-no-files-found: ignore

      - name: Analizar archivos fuente
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, struct, zipfile
          root = pathlib.Path(".")
          report = {"files": [], "zip_entries": [], "notes": []}
          for p in sorted(root.iterdir()):
              if p.is_file() and p.suffix.lower() in (".u", ".zip"):
                  b = p.read_bytes()
                  item = {"name": p.name, "size": len(b), "sha256": hashlib.sha256(b).hexdigest(),
                          "first_32_bytes_hex": b[:32].hex(" ")}
                  if p.suffix.lower() == ".u":
                      item["first_u32_le"] = struct.unpack("<I", b[:4])[0] if len(b) >= 4 else None
                      item["first_u32_be"] = struct.unpack(">I", b[:4])[0] if len(b) >= 4 else None
                      item["contains_unreal_package_marker"] = b"Unreal" in b[:256]
                  report["files"].append(item)
                  if p.suffix.lower() == ".zip":
                      with zipfile.ZipFile(p) as z:
                          for i in z.infolist():
                              report["zip_entries"].append({
                                  "name": i.filename, "size": i.file_size,
                                  "compressed_size": i.compress_size, "crc": f"{i.CRC:08x}",
                                  "is_dir": i.is_dir()
                              })
          pathlib.Path("analysis-report.json").write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY

      - name: Preparar paquete de fuentes para ingenieria inversa
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, zipfile
          out = pathlib.Path("source-inputs.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for name in ("Interface.u", "Carpeta interface.u.zip"):
                  p = pathlib.Path(name)
                  if p.exists():
                      z.write(p, name)
          PY

      - name: Publicar fuentes originales para analisis
        uses: actions/upload-artifact@v4
        with:
          name: methos-u-source-inputs
          path: source-inputs.zip
          if-no-files-found: error

      - name: Publicar informe de analisis
        uses: actions/upload-artifact@v4
        with:
          name: methos-u-analysis
          path: analysis-report.json
          if-no-files-found: error
