name: Methos U Editor - Windows Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "installer/**"
      - "README-ES.txt"
      - "THIRD-PARTY-NOTICES.txt"
      - ".github/workflows/windows-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "installer/**"
      - "README-ES.txt"
      - "THIRD-PARTY-NOTICES.txt"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Inspeccionar Compilador U.zip sin ejecutar sus binarios
        shell: pwsh
        run: |
          @'
          import hashlib, json, pathlib, re, struct, zipfile
          candidates = [p for p in pathlib.Path(".").glob("*.zip")
                        if "compilador" in p.name.lower() and "u" in p.name.lower()]
          if not candidates:
              raise SystemExit("No se encontró el ZIP Compilador U en la raíz del repositorio.")
          report = {"archive": candidates[0].name, "archive_size": candidates[0].stat().st_size,
                    "archive_sha256": hashlib.sha256(candidates[0].read_bytes()).hexdigest(),
                    "entries": [], "readme_text": [], "findings": []}
          with zipfile.ZipFile(candidates[0]) as z:
              bad = z.testzip()
              report["zip_integrity"] = "OK" if bad is None else f"CRC error: {bad}"
              for info in z.infolist():
                  item = {"name": info.filename, "size": info.file_size,
                          "compressed_size": info.compress_size, "crc32": f"{info.CRC:08x}"}
                  if not info.is_dir():
                      data = z.read(info)
                      item["sha256"] = hashlib.sha256(data).hexdigest()
                      item["magic_hex"] = data[:16].hex(" ")
                      ext = pathlib.PurePosixPath(info.filename).suffix.lower()
                      if ext in (".exe", ".dll") and data[:2] == b"MZ":
                          peoff = struct.unpack_from("<I", data, 0x3c)[0] if len(data) >= 64 else 0
                          machine = struct.unpack_from("<H", data, peoff+4)[0] if peoff+6 <= len(data) else None
                          item["pe_machine"] = {0x14c:"x86",0x8664:"x64",0xAA64:"ARM64"}.get(machine, hex(machine) if machine else None)
                          strings = (re.findall(rb"[ -~]{5,}", data) +
                                     re.findall(rb"(?:[ -~]\x00){5,}", data))
                          joined = b" ".join(strings).decode("latin1", "ignore")
                          terms = ["ucc", "unreal", "lineage", "compiler", "decompiler", "ue2", "package"]
                          item["recognized_terms"] = sorted({t for t in terms if t in joined.lower()})
                      if ext in (".txt", ".md", ".readme", ".ini", ".cfg", ".bat", ".cmd", ".ps1"):
                          report["readme_text"].append({"name":info.filename,
                              "text":data[:12000].decode("utf-8", "replace")})
                  report["entries"].append(item)
          report["findings"].append("Los ejecutables se inspeccionaron estáticamente; no se ejecutó ningún archivo del ZIP.")
          pathlib.Path("compiler-zip-report.json").write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding="utf-8")
          print(json.dumps(report,indent=2,ensure_ascii=False))
          '@ | Set-Content -Encoding utf8 inspect_compiler_zip.py
          python inspect_compiler_zip.py

      - name: Guardar informe del compilador externo
        uses: actions/upload-artifact@v4
        with:
          name: methos-u-compiler-zip-analysis
          path: compiler-zip-report.json
          if-no-files-found: error

      - name: Extraer paquetes y fuentes Interlude para pruebas (sin ejecutar UCC)
        shell: pwsh
        run: |
          @'
          import pathlib, zipfile
          archive = next(p for p in pathlib.Path(".").glob("*.zip")
                         if "compilador" in p.name.lower() and "u" in p.name.lower())
          out = pathlib.Path("interlude-fixtures")
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\\\", "/")
                  if info.is_dir():
                      continue
                  lower = name.lower()
                  if lower.endswith(".u") and "/system/" in lower:
                      target = out / pathlib.Path(name).name
                  elif lower.endswith(".uc") and "/interface/classes/" in lower:
                      target = out / "Classes" / pathlib.Path(name).name
                  else:
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))
          print("Extracted:", *sorted(str(p) for p in out.rglob("*") if p.is_file()), sep="\\n")
          '@ | Set-Content -Encoding utf8 extract_interlude_fixtures.py
          python extract_interlude_fixtures.py

      - name: Guardar paquetes y fuentes Interlude de referencia
        uses: actions/upload-artifact@v4
        with:
          name: methos-interlude-reference-fixtures
          path: interlude-fixtures/
          if-no-files-found: error

      - name: Probar motor independiente de paquetes UE2
        shell: pwsh
        run: dotnet run --project tests/MethosUEngine.Tests/MethosUEngine.Tests.csproj -c Release -- Interface.u "Compilador  U.zip" "interlude-fixtures/Interface.u" "interlude-fixtures/Classes" "interlude-fixtures"

      - name: Publicar registro nativo de Core, Engine y NWindow
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methos-native-function-registry
          path: native-function-registry.json
          if-no-files-found: ignore

      - name: Crear icono oficial de Methos (M roja)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src/MethosUEditor/Assets | Out-Null
          ./installer/Create-MethosIcon.ps1 -OutputPath src/MethosUEditor/Assets/Methos.ico

      - name: Publicar ejecutable autónomo x64
        shell: pwsh
        run: |
          dotnet publish src/MethosUEditor/MethosUEditor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Incluir runtime UCC y fuentes originales verificadas de Interface
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = Get-ChildItem -LiteralPath $PWD -File -Filter "*.zip" |
            Where-Object { $_.Name -match "compilador.*u" } |
            Select-Object -First 1
          if (!$archive) { throw "No se encontró Compilador U.zip para empaquetar el runtime." }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            $prefix = "Compilador  U/"
            $runtimeRoot = Join-Path $PWD "publish\UccRuntime"
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName.EndsWith("/")) { continue }
              $relative = $null
              if ($entry.FullName.StartsWith($prefix + "Interlude/System/", [StringComparison]::OrdinalIgnoreCase)) {
                $relative = $entry.FullName.Substring($prefix.Length)
              }
              elseif ($entry.FullName.StartsWith($prefix + "Interlude/Interface/Classes/", [StringComparison]::OrdinalIgnoreCase) -and
                      $entry.FullName.EndsWith(".uc", [StringComparison]::OrdinalIgnoreCase)) {
                $relative = $entry.FullName.Substring($prefix.Length)
              }
              if ($null -ne $relative) {
                $destination = Join-Path $runtimeRoot $relative
                New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
                [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $destination, $true)
              }
            }
          }
          finally { $zip.Dispose() }
          $runtimeSystem = Join-Path $PWD "publish\UccRuntime\Interlude\System"
          $referenceClasses = Join-Path $PWD "publish\UccRuntime\Interlude\Interface\Classes"
          if (!(Test-Path (Join-Path $runtimeSystem "ucc.exe"))) { throw "No se incluyó ucc.exe." }
          $classCount = (Get-ChildItem -LiteralPath $referenceClasses -File -Filter "*.uc").Count
          if ($classCount -lt 150) { throw "Solo se incluyeron $classCount fuentes .uc de referencia." }
          Write-Host "Runtime UCC incluido; fuentes originales de Interface: $classCount clases."

      - name: Descargar el módulo XDAT desde su rama de integración
        shell: pwsh
        run: |
          git clone --branch research/xdat-format-probe --depth 1 https://github.com/Methos48/Methos-XDAT.git "$env:GITHUB_WORKSPACE\\xdat-source"
          if ($LASTEXITCODE -ne 0) { throw "No se pudo descargar el proyecto Methos XDAT." }
          $xdatCommit = (git -C "$env:GITHUB_WORKSPACE\\xdat-source" rev-parse HEAD).Trim()
          Write-Host "Commit XDAT integrado en Methos: $xdatCommit"

      - name: Instalar Python 3.12 para el módulo XDAT
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Compilar y probar el módulo XDAT
        shell: pwsh
        run: |
          $xdatRepo = Join-Path $env:GITHUB_WORKSPACE "xdat-source"
          $zip = Join-Path $xdatRepo "Methos_XDAT_Windows_Build_Kit_v1.0 (1).zip"
          if (!(Test-Path $zip)) { throw "No se encontró el kit fuente de Methos XDAT." }
          $extract = Join-Path $env:RUNNER_TEMP "methos-xdat-kit"
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $project = Get-ChildItem $extract -Directory | Select-Object -First 1
          if (!$project) { throw "El kit XDAT no contiene la carpeta del proyecto." }

          python "$xdatRepo\\apply_detection_layer.py" "$($project.FullName)"
          if ($LASTEXITCODE -ne 0) { throw "Falló la capa de detección XDAT." }
          python "$xdatRepo\\auto_pipeline_overlay.py" "$($project.FullName)"
          if ($LASTEXITCODE -ne 0) { throw "Falló la integración del pipeline XDAT." }

          $cryptoZip = Join-Path $env:RUNNER_TEMP "l2encdec-win32.zip"
          Invoke-WebRequest -Uri "https://github.com/ritsuwastaken/open-l2encdec/releases/download/1.5.1/l2encdec-1.5.1-win32.zip" -OutFile $cryptoZip
          $cryptoDir = Join-Path $env:RUNNER_TEMP "methos-xdat-crypto"
          Expand-Archive -LiteralPath $cryptoZip -DestinationPath $cryptoDir -Force
          $engine = Get-ChildItem $cryptoDir -Recurse -File | Where-Object { $_.Name -ieq "l2encdec.exe" } | Select-Object -First 1
          if (!$engine) { throw "No se encontró el motor l2encdec.exe." }
          Copy-Item $engine.FullName (Join-Path $project.FullName "l2encdec.exe") -Force

          python -m pip install --upgrade pip
          python -m pip install -r (Join-Path $project.FullName "requirements-build.txt")
          Push-Location $project.FullName
          try {
            python -m py_compile app.py xdat_core.py encryption_detection.py auto_pipeline.py
            if ($LASTEXITCODE -ne 0) { throw "Falló la verificación de sintaxis XDAT." }
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -ne 0) { throw "Fallaron las pruebas XDAT." }
            cmd /c build_windows.bat
            if ($LASTEXITCODE -ne 0) { throw "Falló la compilación Windows del módulo XDAT." }
          }
          finally { Pop-Location }

          $xdatExe = Get-ChildItem (Join-Path $project.FullName "dist") -Recurse -File -Filter "Methos XDAT.exe" | Select-Object -First 1
          if (!$xdatExe) { throw "La compilación XDAT terminó sin generar Methos XDAT.exe." }
          $target = Join-Path $env:GITHUB_WORKSPACE "publish\\XDAT"
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item "$($xdatExe.Directory.FullName)\\*" -Destination $target -Recurse -Force
          Write-Host "Módulo XDAT integrado en publish\\XDAT: $($xdatExe.FullName)"

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$iscc) { $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue; if ($cmd) { $iscc = $cmd.Source } }
          if (!$iscc) { throw "No se encontró Inno Setup." }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Crear instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & $env:ISCC installer\Methos-U-Editor.iss
          if ($LASTEXITCODE -ne 0) { throw "Falló Inno Setup." }

      - name: Probar instalación silenciosa y arranque de Methos
        shell: pwsh
        run: |
          $setup = Join-Path $PWD "release\Methos-Setup.exe"
          if (!(Test-Path $setup)) { throw "No se generó el instalador." }
          if ((Get-Item $setup).Length -lt 1MB) { throw "El instalador parece incompleto o demasiado pequeño." }

          $installDir = Join-Path $env:RUNNER_TEMP "Methos Smoke Test"
          $installArgs = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$installDir`""
          $install = Start-Process -FilePath $setup -ArgumentList $installArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "La instalación silenciosa falló con código $($install.ExitCode)." }
          Write-Host "Instalación de prueba en: $installDir"

          $app = Join-Path $installDir "Methos.exe"
          $system = Join-Path $installDir "UccRuntime\Interlude\System"
          $ucc = Join-Path $system "ucc.exe"
          $reference = Join-Path $installDir "UccRuntime\Interlude\Interface\Classes"
          if (!(Test-Path $app)) { throw "El instalador no colocó la aplicación." }
          foreach ($required in @("ucc.exe", "UIScript.ini", "Core.u", "Engine.u", "NWindow.u")) {
            if (!(Test-Path (Join-Path $system $required))) { throw "Falta el componente UCC requerido: $required." }
          }
          $classes = (Get-ChildItem -LiteralPath $reference -File -Filter "*.uc").Count
          if ($classes -ne 169) { throw "Se esperaban exactamente 169 fuentes de referencia; se instalaron $classes." }
          foreach ($requiredClass in @("UICommonAPI.uc", "AutoBuffWnd.uc", "AutoPotionsWnd.uc", "AutoSkillWnd.uc")) {
            if (!(Test-Path (Join-Path $reference $requiredClass))) { throw "Falta la fuente de referencia requerida: $requiredClass." }
          }
          $xdatExe = Join-Path $installDir "XDAT\\Methos XDAT.exe"
          if (!(Test-Path $xdatExe)) { throw "El instalador no incluyó el módulo XDAT." }
          $xdatEngine = Get-ChildItem -LiteralPath (Join-Path $installDir "XDAT") -Recurse -File -Filter "l2encdec.exe" | Select-Object -First 1
          if (!$xdatEngine) { throw "El instalador no incluyó el motor de cifrado XDAT dentro del módulo." }
          Write-Host "Motor XDAT encontrado en: $($xdatEngine.FullName)"

          $xdatProcess = Start-Process -FilePath $xdatExe -WorkingDirectory (Split-Path $xdatExe) -PassThru
          Start-Sleep -Seconds 8
          $xdatProcess.Refresh()
          if ($xdatProcess.HasExited) { throw "El módulo XDAT se cerró durante la prueba de arranque (código $($xdatProcess.ExitCode))." }
          Stop-Process -Id $xdatProcess.Id -Force
          Write-Host "SMOKE TEST XDAT OK: ejecutable y motor integrados."

          $workRoot = Join-Path $installDir "Archivos U"
          foreach ($folder in @("Comprimido", "Descomprimido")) {
            if (!(Test-Path (Join-Path $workRoot $folder))) { throw "No se creó la carpeta de trabajo '$folder' dentro de Archivos U." }
          }

          $xdatWorkRoot = Join-Path $installDir "Archivos XDAT"
          foreach ($folder in @("Comprimido", "Descomprimido")) {
            if (!(Test-Path (Join-Path $xdatWorkRoot $folder))) { throw "No se creó la carpeta de trabajo '$folder' dentro de Archivos XDAT." }
          }

          $process = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "Methos se cerró durante la prueba de arranque (código $($process.ExitCode))." }
          Stop-Process -Id $process.Id -Force
          Write-Host "SMOKE TEST OK: instalación, aplicación, UCC y $classes fuentes de referencia."

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (Test-Path $uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "La desinstalación de prueba falló." }
          }

      - name: Publicar instalador de Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: Methos-Windows-Installer-x64
          path: release/Methos-Setup.exe
          if-no-files-found: error
